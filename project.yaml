schema_version: 0.1.0
name: Compound Shocks Panel
kind: study
purpose: side_project
confidentiality: public
# Replace the placeholder audience with the real readers and users; add one entry per audience.
audiences:
  - name: primary-readers
    needs: A documented, re-runnable district-month panel (conflict, rainfall, prices, displacement) and a data audit that says what the sources can and cannot support.
    technical_level: practitioner
    channel: public
publication:
  # Purpose is side_project because the charter has no exploratory category; revisit it at the review gate if the work becomes a paper. Phase A produces a data panel and audit memo only. A venue is chosen at the review gate, after the audit and literature gap check.
  venues: []
  preregistration: ''
# Each final product, its audience, and the command that builds it. `reproduce` builds all of them.
deliverables:
  - id: panel
    audience: primary-readers
    format: csv
    build: uv run python -m compound_shocks reproduce --instance somalia
  - id: data-audit-memo
    audience: primary-readers
    format: markdown
    build: uv run python -m compound_shocks reproduce --instance somalia
taxonomy:
  tags: []
sources: []
siblings: []
