schema_version: 0.1.0
geography: Sudan
# Window (my call, 2026-11-02, for the owner to confirm): two years before the April 2023 war and the first
# 21 months after it, so price and displacement coverage can be compared across the break.
period:
  start: '2021-01-01'
  end: '2024-12-31'
sources:
  conflict_events:
    provider: ACLED
    dataset: ACLED export, Sudan
  displacement:
    provider: IOM DTM
    dataset: Sudan IOM DTM data for admin levels 0-2, HDX sdn-iom-dtm-from-api
  prices:
    provider: WFP
    dataset: Sudan - Food Prices, HDX wfp-food-prices-for-sudan
  rainfall:
    provider: UCSB CHC CHIRPS
    dataset: CHIRPS v2.0 monthly, Africa
  admin_boundaries:
    provider: OCHA COD-AB
    dataset: Sudan - Subnational Administrative Boundaries, HDX cod-ab-sdn
  population:
    provider: OCHA COD-PS
    dataset: Sudan population estimates, HDX cod-ps-sdn
parameters:
  imported_basket: [wheat flour, cooking oil]
  local_basket: [sorghum, millet]
  base_month: '2021-01'
