schema_version: 0.1.0
geography: Somalia
# Window ends 2023-08 because the HDX PRMN displacement dataset ends then (owner decision 2026-10-31).
period:
  start: '2021-01-01'
  end: '2023-08-31'
sources:
  conflict_events:
    provider: ACLED
    dataset: ACLED export, Somalia
  displacement:
    provider: UNHCR/NRC PRMN
    dataset: Somalia - Internally Displaced Persons (IDPs), HDX somalia-internally-displaced-persons-idps
  prices:
    provider: WFP
    dataset: Somalia - Food Prices, HDX wfp-food-prices-for-somalia
  rainfall:
    provider: UCSB CHC CHIRPS
    dataset: CHIRPS v2.0 monthly, Africa
  admin_boundaries:
    provider: OCHA COD-AB
    dataset: Somalia - Subnational Administrative Boundaries, HDX cod-ab-som
  population:
    provider: OCHA COD-PS
    dataset: Somalia population estimates for humanitarian planning, HDX cod-ps-som
parameters:
  imported_basket: [wheat flour, cooking oil]
  local_basket: [red sorghum, white maize]
  base_month: '2021-01'
  # Processing decision (owner, 2026-11-02): PRMN and WFP report Mogadishu as one unit, "Banadir", but COD-AB v03
  # (valid 2025-01-08) splits it into 17 districts plus an "Unspecified" remainder polygon. All 18 polygons are
  # dissolved into one unit so every source maps to the same unit. See protocol.md, decision log.
  merge_districts:
    - id: SO22
      name: Banadir
      members:
        [SO2201, SO2202, SO2203, SO2204, SO2205, SO2206, SO2207, SO2208, SO2209, SO2210, SO2211, SO2212, SO2213,
         SO2214, SO2215, SO2216, SO2217, Unspecified]
