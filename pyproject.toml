[project]
name = "compound-shocks-panel"
version = "0.1.2"
description = "Compound Shocks Panel"
requires-python = ">=3.11"
dependencies = [
    "reprokit @ git+https://github.com/AaronScherf/reprokit@v0.3.1",
    "pandas",
    "openpyxl",
    "geopandas",
    "rasterio",
    "shapely",
    "matplotlib",
    "doit",
    "requests",
    "psutil",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/compound_shocks"]

[project.scripts]
compound-shocks = "compound_shocks.cli:main"

[tool.pytest.ini_options]
markers = ["real_data: reads real downloaded data when present; skipped otherwise"]
