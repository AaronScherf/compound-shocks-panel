[project]
name = "compound-shocks-panel"
version = "0.1.0"
description = "Compound Shocks Panel"
requires-python = ">=3.11"
dependencies = [
    "reprokit @ git+https://github.com/AaronScherf/reprokit@v0.2.0",
    "pandas",
    "geopandas",
    "rasterio",
    "shapely",
    "statsmodels",
    "matplotlib",
    "doit",
    "requests",
]

[dependency-groups]
dev = ["pytest", "ruff"]
